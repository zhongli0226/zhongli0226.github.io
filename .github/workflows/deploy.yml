name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-build

      - name: Install Quartz dependencies
        run: |
          cd quartz-build
          npm ci

      - name: Setup content
        run: |
          rm -rf quartz-build/content
          cp -r obsidian quartz-build/content

      - name: Update config
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          # For user/org sites (repo named username.github.io), no path prefix
          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE_URL="${REPO_OWNER}.github.io"
          else
            BASE_URL="${REPO_OWNER}.github.io/${REPO_NAME}"
          fi

          echo "GitHub Pages URL: https://${BASE_URL}/"

          # Update baseUrl in our config
          sed -i "s|baseUrl: \".*\"|baseUrl: \"${BASE_URL}\"|g" quartz.config.ts

          # Copy our config and custom styles into Quartz
          cp quartz.config.ts quartz-build/quartz.config.ts
          cp custom.scss quartz-build/quartz/styles/custom.scss
          grep "baseUrl:" quartz-build/quartz.config.ts

      - name: Build site
        run: |
          cd quartz-build
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
